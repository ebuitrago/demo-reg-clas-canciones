# Blueprint de Render: New + > Blueprint > seleccionar el fork de este repositorio.
services:
  - type: web
    name: prediccion-canciones
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RUTA_MODELO
        value: models/modelo.joblib
