<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predicción de popularidad de canciones</title>
<!-- Cliente web de la demo: consume el servicio de predicción por HTTP.
     No contiene el modelo ni la ficha: todo lo pide al servidor. -->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #FBF6EA; color: #202020; }
  header { background: #284766; color: white; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; font-size: .85rem; color: #C8D4E0; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  section { background: white; border: 1px solid #E3DCCB; border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
  h2 { color: #284766; font-size: 1.05rem; margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: .85rem; }
  input, select { width: 100%; padding: 7px; border: 1px solid #D9D9D9; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 14px; background: #C95E56; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button.secundario { background: #4A8DA5; }
  #resultado { margin-top: 12px; padding: 12px; border-radius: 6px; display: none; font-size: .95rem; }
  #resultado.si { display: block; background: #EFF8F2; border: 1px solid #C4E2CF; }
  #resultado.no { display: block; background: #F7F7F7; border: 1px solid #DDDDDD; }
  #resultado.error { display: block; background: #FCF1EF; border: 1px solid #EFC9C2; color: #A93226; }
  .grande { font-size: 1.6rem; font-weight: 700; color: #284766; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid #EEE; vertical-align: top; }
  th { color: #284766; width: 38%; }
  #estado { font-size: .8rem; color: #5C5C5C; }
  code { background: #F2F2F2; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>Predicción de popularidad de canciones</h1>
  <p>Cliente web del servicio de predicción. El modelo y su ficha están en el servidor.</p>
</header>

<main>
  <section>
    <h2>Ficha del modelo cargado</h2>
    <p>Datos del modelo cargado, tal como los publica <code>GET /modelo</code>.</p>
    <table><tbody id="ficha"></tbody></table>
    <button class="secundario" onclick="cargarFicha()">Actualizar ficha</button>
  </section>

  <section>
    <h2>Una canción nueva</h2>
    <div class="grid">
      <div><label>Bailabilidad (0-1)</label><input id="bailabilidad" type="number" step="0.01" min="0" max="1" value="0.72"></div>
      <div><label>Energía (0-1)</label><input id="energia" type="number" step="0.01" min="0" max="1" value="0.65"></div>
      <div><label>Valencia (0-1)</label><input id="valencia" type="number" step="0.01" min="0" max="1" value="0.55"></div>
      <div><label>Acústica (0-1)</label><input id="acustica" type="number" step="0.01" min="0" max="1" value="0.12"></div>
      <div><label>Tempo (bpm)</label><input id="tempo" type="number" step="0.1" min="40" max="250" value="118"></div>
      <div><label>Duración (min)</label><input id="duracion_min" type="number" step="0.01" min="0.5" max="15" value="3.4"></div>
      <div><label>Volumen (dB)</label><input id="volumen_db" type="number" step="0.1" min="-60" max="5" value="-6.5"></div>
      <div><label>Año de lanzamiento</label><input id="anio" type="number" min="1990" max="2035" value="2026"></div>
      <div><label>Género</label>
        <select id="genero"><option>pop</option><option selected>urbano</option><option>rock</option><option>electronica</option><option>indie</option></select></div>
      <div><label>Colaboración</label>
        <select id="colaboracion"><option value="1" selected>Sí</option><option value="0">No</option></select></div>
    </div>
    <button onclick="predecir()">Predecir</button>
    <div id="resultado"></div>
  </section>

  <p id="estado">Consultando el servidor</p>
</main>

<script>
// Dirección base del servicio. Vacía cuando esta página se sirve desde el
// propio servidor; con la URL completa (p. ej. la de Render) si el archivo
// se abre de forma independiente.
const SERVIDOR = "";
const CAMPOS = ["bailabilidad", "energia", "valencia", "acustica", "tempo", "duracion_min", "volumen_db", "anio", "colaboracion", "genero"];

// Un diccionario plano de la ficha como "clave: valor" separados por " | ".
function legible(obj) {
  if (obj == null) return "";
  if (typeof obj !== "object") return String(obj);
  return Object.entries(obj).map(([k, v]) => `<strong>${k}</strong>: ${v}`).join(" &nbsp;|&nbsp; ");
}

async function cargarFicha() {
  const r = await fetch(SERVIDOR + "/modelo");
  if (!r.ok) { document.getElementById("ficha").innerHTML = `<tr><td colspan="2">Sin modelo cargado (${r.status})</td></tr>`; return; }
  const f = await r.json();
  const filas = [
    ["Modelo", `${f.nombre} (${f.tarea}, ${f.fecha || ""})`],
    ["Objetivo", f.objetivo],
    ["Momento de la predicción", f.momento_prediccion],
    ["Variables excluidas", Object.entries(f.variables_excluidas || {}).map(([k, v]) => `<code>${k}</code>: ${v}`).join("<br>")],
    ["Entrenamiento / prueba", `${f.entrenamiento?.periodo} (${f.entrenamiento?.n}) / ${f.prueba?.periodo} (${f.prueba?.n}, ${f.prueba?.tipo})`],
    ["Línea base", legible(f.linea_base)],
    ["Desempeño (prueba)", legible(f.desempeno)],
    ["Decisión", legible(f.decision)],
    ["Límites", f.limites || ""],
  ];
  document.getElementById("ficha").innerHTML = filas.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
}

async function predecir() {
  const cancion = {};
  for (const c of CAMPOS) {
    const el = document.getElementById(c);
    cancion[c] = c === "genero" ? el.value : Number(el.value);
  }
  const caja = document.getElementById("resultado");
  const r = await fetch(SERVIDOR + "/predecir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cancion) });
  const datos = await r.json();
  if (!r.ok) {
    caja.className = "error";
    caja.innerHTML = `Error ${r.status}: ${JSON.stringify(datos.detail)}`;
    return;
  }
  caja.className = datos.promocionar ? "si" : "no";
  if (datos.tarea === "regresion") {
    caja.innerHTML = `<div class="grande">Popularidad esperada: ${datos.popularidad_esperada}</div>
      Rango (± MAE del modelo): ${datos.rango[0]} a ${datos.rango[1]}. Corte de promoción: ${datos.corte_promocion}<br>
      <strong>${datos.promocionar ? "Recomendación: promocionar" : "Recomendación: no promocionar"}</strong>: ${datos.explicacion}<br>
      <small>Modelo: ${datos.modelo}</small>`;
  } else {
    caja.innerHTML = `<div class="grande">Probabilidad de hit: ${datos.probabilidad_hit}</div>
      Umbral de decisión: ${datos.umbral}<br>
      <strong>${datos.promocionar ? "Recomendación: promocionar" : "Recomendación: no promocionar"}</strong>: ${datos.explicacion}<br>
      <small>Modelo: ${datos.modelo}</small>`;
  }
}

async function estado() {
  try {
    const r = await fetch(SERVIDOR + "/salud");
    const s = await r.json();
    document.getElementById("estado").textContent = s.modelo_cargado ? `Servidor activo. Modelo: ${s.modelo}, tarea: ${s.tarea}` : "Servidor activo, sin modelo cargado";
  } catch (e) {
    document.getElementById("estado").textContent = "No se pudo contactar al servidor";
  }
}

estado(); cargarFicha();
</script>
</body>
</html>
