[project]
name = "prediccion-canciones"
version = "1.1.0"
description = "Taller de regresión lineal y clasificación binaria: del análisis al servicio de predicción"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Elias Buitrago Bolivar" }]

# Las dependencias se declaran en requirements.txt (servicio) y requirements-dev.txt
# (desarrollo), que es lo que usa Render. Este archivo configura las herramientas.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebook didáctico: cada celda importa lo que usa y la celda de la auditoría reproduce
# tal cual el código entregado por un asistente de IA.
"notebooks/*" = ["E402", "E501", "B018", "I001", "F811", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
